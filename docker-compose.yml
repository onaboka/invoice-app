services:
  app:
    build:
      context: docker
      dockerfile: Dockerfile
    container_name: invoice-app-php
    volumes:
      - ./:/var/www
    networks:
      - invoice-app-net

  nginx:
    image: nginx:alpine
    container_name: invoice-app-nginx
    ports:
      - "8010:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - invoice-app-net

  mysql:
    image: mysql:8.0
    container_name: invoice-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invoice-app
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3310:3306"
    volumes:
      - invoice-app-mysql-data:/var/lib/mysql
    networks:
      - invoice-app-net

  redis:
    image: redis:alpine
    container_name: invoice-app-redis
    ports:
      - "6390:6379"
    networks:
      - invoice-app-net

networks:
  invoice-app-net:
    driver: bridge

volumes:
  invoice-app-mysql-data: