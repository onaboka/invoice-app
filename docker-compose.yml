
services:
    app:
        build:
            context: docker
            dockerfile: Dockerfile
        container_name: invoice-app-php
        volumes:
            - ./:/var/www
        networks:
            - invoice-app-net
        depends_on:
            - mysql
            - redis

    nginx:
        image: nginx:alpine
        container_name: invoice-app-nginx
        restart: unless-stopped
        ports:
            - "8010:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - invoice-app-net

    mysql:
        image: mysql:8.0
        container_name: invoice-app-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: invoice_app
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        ports:
            - "127.0.0.1:3310:3306"
        volumes:
            - invoice-app-mysql-data:/var/lib/mysql
        networks:
            - invoice-app-net
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:alpine
        container_name: invoice-app-redis
        restart: unless-stopped
        ports:
            - "127.0.0.1:6390:6379"
        networks:
            - invoice-app-net

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: invoice-app-phpmyadmin
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            UPLOAD_LIMIT: 64M
        ports:
            - "127.0.0.1:8081:80"
        networks:
            - invoice-app-net

networks:
    invoice-app-net:
        driver: bridge

volumes:
    invoice-app-mysql-data:
